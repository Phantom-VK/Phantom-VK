<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="920"
  height="358"
  viewBox="0 0 920 358"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="stack-title stack-desc"
>
  <title id="stack-title">Tech Stack</title>
  <desc id="stack-desc">Tech Stack</desc>

  <defs>
    
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      fill: #8B9099;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      fill: #F2F3F5;
    }

    .stat-label {
      font-size: 13px;
      font-weight: 450;
      fill: #8B9099;
    }

    .stat-value {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      fill: #F2F3F5;
      font-variant-numeric: tabular-nums;
    }

    .rank-value {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.02em;
      fill: #F2F3F5;
      font-variant-numeric: tabular-nums;
    }

    .meta {
      font-size: 10px;
      font-weight: 450;
      letter-spacing: 0.02em;
      fill: #8B9099;
      font-variant-numeric: tabular-nums;
    }

    .lang-name {
      font-size: 13px;
      font-weight: 450;
      fill: #F2F3F5;
    }

    .icon {
      fill: #8B9099;
    }

    .stagger {
      opacity: 0;
      animation: fadeIn 200ms cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }

    .lang-progress {
      transform-box: fill-box;
      transform-origin: left center;
      transform: scaleX(0);
      animation: growBar 200ms cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }

    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes growBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    @media (prefers-reduced-motion: reduce) {
      .stagger { animation: none; opacity: 1; }
      .lang-progress { animation: none; transform: scaleX(1); }
    }
  </style>

  <!-- Card surface -->
  <rect x="0.5" y="0.5" rx="10"
    width="919" height="357"
    fill="#0B0C0E"
    stroke="#23252A"
  />

  
  <!-- Title -->
  <text x="32" y="40" class="title">Tech Stack</text>

  <!-- Column 1 -->
  <g transform="translate(32, 76)">
    <g class="stagger" style="animation-delay: 0ms">
    <g>
      <text x="0" y="10" class="eyebrow">Languages</text>
      <text x="0" y="32" class="stat-label">Python · Java · Kotlin</text>
    </g>
    <g>
      <text x="0" y="68" class="eyebrow">AI &amp; ML</text>
      <text x="0" y="90" class="stat-label">TensorFlow · Keras · Scikit-learn · Hugging Face</text>
      <text x="0" y="108" class="stat-label">LLMs · LangGraph</text>
    </g>
    <g>
      <text x="0" y="144" class="eyebrow">Backend &amp; Frameworks</text>
      <text x="0" y="166" class="stat-label">FastAPI · Spring Boot · Flask · Apache Kafka</text>
    </g></g>
  </g>

  <!-- Column 2 -->
  <g transform="translate(480, 76)">
    <g class="stagger" style="animation-delay: 40ms">
    <g>
      <text x="0" y="10" class="eyebrow">Cloud &amp; DevOps</text>
      <text x="0" y="32" class="stat-label">AWS · Docker · GitHub Actions · Linux</text>
    </g>
    <g>
      <text x="0" y="68" class="eyebrow">Databases</text>
      <text x="0" y="90" class="stat-label">PostgreSQL · MongoDB · SQLite</text>
    </g>
    <g>
      <text x="0" y="126" class="eyebrow">Tools</text>
      <text x="0" y="148" class="stat-label">Git · Postman · PyCharm · IntelliJ IDEA</text>
    </g></g>
  </g>

  <!-- Top repositories -->
  <g transform="translate(32, 76)">
    
    <g class="stagger" style="animation-delay: 80ms" transform="translate(0, 192)">
      <text x="0" y="10" class="eyebrow">Top Repositories</text>
      <text x="0" y="32" class="stat-label">MyPortfolio (★20)  ·  NoRefund (★3)  ·  AgentTuring (★1)</text>
    </g>
  </g>
</svg>